name: Build Artifacts

# Builds release binaries for macOS and Linux whenever a version tag is
# pushed. Tag master commits, e.g.:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The built binaries are uploaded as workflow artifacts and, for `v*` tags,
# attached to a GitHub Release.
on:
  push:
    tags:
      - "v*"
  # Allow manual runs (produces artifacts only, no release).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          bin="hyperspace"
          staging="hyperspace-${{ matrix.name }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/$bin" "$staging/"
          cp README.md CLAUDE.md "$staging/" 2>/dev/null || true
          cp -r scenes shaders "$staging/" 2>/dev/null || true
          archive="${staging}.tar.gz"
          tar -czf "$archive" "$staging"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperspace-${{ matrix.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}
