# All shaders — 4x3 grid (4 columns, 3 rows).
# Keep this up to date as new shaders are added.
# Run with: cargo run -- scenes/all.toml 4x3

[audio]
device = "Scarlett"
channels = "4,5"

[grid_0]
shader = "shaders/hyperspace_tunnel.wgsl"

[grid_1]
shader = "shaders/engine_gauges.wgsl"

[grid_2]
shader = "shaders/plasma_vortex.wgsl"

[grid_3]
shader = "shaders/neon_grid.wgsl"

[grid_4]
shader = "shaders/fractal_pulse.wgsl"

[grid_5]
shader = "shaders/hyperdrive.wgsl"

[grid_6]
shader = "shaders/classic_viz.wgsl"

[grid_7]
shader = "shaders/cyberpunk.wgsl"

[grid_8]
shader = "shaders/lava_lamp.wgsl"

[grid_9]
shader = "shaders/oscilloscope.wgsl"

[grid_10]
shader = "shaders/cellular.wgsl"

[grid_11]
shader = "shaders/hyperdrive.wgsl"
