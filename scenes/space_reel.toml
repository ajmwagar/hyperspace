# Space Reel — all Apollo/space footage with neon spiral effects.

[audio]
device = "Scarlett"
channels = "4,5"

[center]
shader = "shaders/video_player.wgsl"
video_speed = 0.35
video_sources = [
    "samples/earthrise.gif",
    "samples/rocket_launch.gif",
    "samples/launchpad.gif",
    "samples/rocket_flight.gif",
    "samples/apollo_mission.gif",
    "samples/apollo1.gif",
    "samples/apollo2.gif",
    "samples/lander.gif",
    "samples/apollo_jump.gif",
    "samples/rover.gif",
    "samples/apollo_faceplant.gif",
    "samples/splashdown.gif",
    "samples/release.gif",
    "samples/1984.gif",
]
post = ["shaders/post/flow_spiral.wgsl", "shaders/post/colormap_neon.wgsl"]
