[package]
name = "hyperspace"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Audio-reactive video synthesis engine for CRT displays"

[dependencies]
wgpu = "24"
winit = "0.30"
cpal = "0.15"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
image = { version = "0.25", optional = true }
gif = { version = "0.13", optional = true }

[features]
capture = ["image", "gif"]

[[example]]
name = "capture"
required-features = ["capture"]

[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.22"
