[package]
name = "hyperspace"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Audio-reactive video synthesis engine for CRT displays"

[dependencies]
wgpu = "24"
winit = "0.30"
cpal = "0.15"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
image = "0.25"
serde_json = "1"
gif = { version = "0.13", optional = true }
hound = { version = "3", optional = true }

[features]
capture = ["gif"]
render = ["hound"]

[[example]]
name = "capture"
required-features = ["capture"]

[[example]]
name = "render"
required-features = ["render"]

[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.22"
